<app-login></app-login>

<div class="auth-overlay-container">
  <div class="auth-card">
    <div class="form-container">
      
      <h1>Find your account</h1>
      <p class="subtitle">Enter your email and we'll send you a link to get back into your account.</p>
      
      <div class="success-message" *ngIf="isSubmitted">
        If an account exists for that email, a recovery link has been sent. Please check your inbox.
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" *ngIf="!isSubmitted">
        <div class="field-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="student@estgf.ipp.pt">
          
          <div class="error-text" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
            <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
          </div>
        </div>

        <button type="submit" class="auth-btn" [disabled]="forgotPasswordForm.invalid">
          Send Recovery Link
        </button>
      </form>

      <p class="switch-auth">
        Remember your password? <a routerLink="/login">Back to Login</a>
      </p>

    </div>
  </div>
</div>
