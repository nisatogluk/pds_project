<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Admin Dashboard</h1>
    <p>Occurrence Management System</p>
  </header>

  <div class="table-wrapper">
    <table class="occurrence-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Report Date</th>
          <th>Category</th>
          <th>Current Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#001</td>
          <td>2026-05-18</td>
          <td>Infrastructure</td>
          <td>PENDING</td>
          <td>
            <button class="btn-update" (click)="openStatusModal('PENDING')">Update Status</button>
          </td>
        </tr>
        <tr>
          <td>#002</td>
          <td>2026-05-19</td>
          <td>Sanitation</td>
          <td>UNDER_ANALYSIS</td>
          <td>
            <button class="btn-update" (click)="openStatusModal('UNDER_ANALYSIS')">Update Status</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-status-update-modal 
  [isOpen]="isModalOpen" 
  [currentStatus]="selectedOccurrenceStatus"
  (close)="closeStatusModal()"
  (save)="handleStatusUpdate($event)">
</app-status-update-modal>
