<div class="login-container">
  <div class="login-box">
    <h2>Civic Participation</h2>
    <p>Sign in to your account to report occurrences</p>

    <form>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="e.g. student@estgf.ipp.pt">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password">
      </div>

      <button type="button" class="login-button" routerLink="/profile">Sign In</button>
      
      <div class="footer-links">
        <a href="#">Forgot password?</a>
        <br><br>
        <span>Don't have an account? </span>
        <a routerLink="/register" style="cursor: pointer;">Create Account</a>
      </div>
    </form>
  </div>
</div>
