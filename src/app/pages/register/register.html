<div class="auth-container">
  <div class="auth-split-left">
    <div class="overlay-content">
      <h2>Join our community today</h2>
      <p>Start reporting occurrences and improve your city</p>
    </div>
  </div>

  <div class="auth-split-right">
    <div class="form-container">
      <h1>Create your account!</h1>
      
      <div *ngIf="errorMessage" style="background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center;">
        {{ errorMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="field-group">
          <label>Username</label>
          <input type="text" formControlName="username" placeholder="Choose a username">
          <div class="error-text" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
            <span *ngIf="registerForm.get('username')?.errors?.['required']">Username is required.</span>
          </div>
        </div>

        <div class="field-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="student@estgf.ipp.pt">
          <div class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email format.</span>
          </div>
        </div>

        <div class="field-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="Create a password">
          <div class="error-text" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</span>
          </div>
        </div>

        <button type="submit" class="auth-btn" [disabled]="registerForm.invalid">
          Create Account
        </button>
      </form>

      <p class="switch-auth">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
