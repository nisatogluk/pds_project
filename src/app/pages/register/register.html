<div class="register-container">
  <div class="register-box">
    <h2>Create Account</h2>
    <p>Join the community and help improve your city</p>

    <form>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Your name">
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="e.g. student@estgf.ipp.pt">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Create a strong password">
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" placeholder="Repeat your password">
      </div>

      <button type="button" class="register-button" routerLink="/login">Sign Up</button>
      
      <div class="footer-links">
        <span>Already have an account? </span>
        <a routerLink="/login" style="cursor: pointer;">Sign In</a>
      </div>
    </form>
  </div>
</div>
