<div class="modal-backdrop" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Update Occurrence Status</h2>
    <p>Select the new status according to the system requirements:</p>
    
    <select class="status-dropdown" [(ngModel)]="currentStatus">
      <option value="PENDING">Pending</option>
      <option value="UNDER_ANALYSIS">Under Analysis</option>
      <option value="APPROVED">Approved</option>
      <option value="REJECTED">Rejected</option>
      <option value="SOLVED">Solved</option>
    </select>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-submit" (click)="saveStatus()">Update Status</button>
    </div>
  </div>
</div>
