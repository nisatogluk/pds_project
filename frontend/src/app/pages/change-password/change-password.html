<div class="password-page">
  <div class="password-card">
    <h2>Change Password</h2>
    <p class="subtitle">Update your security credentials.</p>

    <div *ngIf="showSuccess" class="success-box">Password updated successfully!</div>
    <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      
      <div class="input-group">
        <label>Current Password</label>
        <input formControlName="currentPassword" type="password" placeholder="Enter current password">
      </div>

      <div class="input-group">
        <label>New Password</label>
        <input formControlName="newPassword" type="password" placeholder="At least 6 characters">
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <input formControlName="confirmPassword" type="password" placeholder="Repeat new password">
      </div>

      <div class="actions">
        <button type="submit" class="save-btn" [disabled]="!passwordForm.valid">
          Update Password
        </button>
      </div>

    </form>
  </div>
</div>
