<div class="auth-container">
  <div class="auth-split-left">
    <div class="overlay-content">
      <h2>Welcome back to the community</h2>
      <p>Log in to explore and report occurrences</p>
    </div>
  </div>

  <div class="auth-split-right">
    <div class="form-container">
      <h1>Log in to your account!</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field-group">
          <label>Email</label>
          <input type="text" formControlName="email" placeholder="student@estgf.ipp.pt">
          <div class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</span>
          </div>
        </div>

        <div class="field-group">
          <label>Password</label>
          <div style="position: relative; display: block;">
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              formControlName="password"
              placeholder="Password"
              style="padding-right: 45px;">

            <button
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
              style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #888; display: flex; padding: 0;">

              <svg *ngIf="!isPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

              <svg *ngIf="isPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
          </div>
        </div>

        <div class="forgot-pass">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <div class="server-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="auth-btn" [disabled]="loginForm.invalid">
          Continue
        </button>
      </form>

      <p class="switch-auth">
        Don't have an account? <a routerLink="/register">Sign up</a>
      </p>
    </div>
  </div>
</div>
