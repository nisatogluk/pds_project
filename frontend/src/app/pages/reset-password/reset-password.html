<app-login></app-login>

<div class="auth-overlay-container">
  <div class="auth-card">
    <div class="form-container">
      
      <h1>Reset your password</h1>
      <p class="subtitle">Please enter your new password below.</p>
      
      <div class="success-message" *ngIf="isSubmitted">
        Password has been reset successfully! Redirecting to login...
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" *ngIf="!isSubmitted">
        
        <div class="field-group">
          <label>New Password</label>
          <input type="password" formControlName="newPassword" placeholder="Enter new password">
          <div class="error-text" *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
            <span *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Password is required.</span>
            <span *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <div class="field-group">
          <label>Confirm Password</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">
          <div class="error-text" *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched">
            <span *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your password.</span>
          </div>
        </div>

        <button type="submit" class="auth-btn" [disabled]="resetPasswordForm.invalid">
          Reset Password
        </button>
      </form>

    </div>
  </div>
</div>
