<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Occurrence Management System</p>
      </div>
    </div>
  </header>

  <div class="table-wrapper">
    <table class="occurrence-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Current Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let occurrence of occurrences">
          <td>{{ occurrence._id | slice:0:6 }}</td>
          <td>{{ occurrence.title }}</td>
          <td>{{ occurrence.category }}</td>
          <td><span class="status-pill" [ngClass]="occurrence.status.toLowerCase()">{{ occurrence.status }}</span></td>
          <td>
            <button class="btn-update" (click)="openStatusModal(occurrence)">Update Status</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-status-update-modal 
  [isOpen]="isModalOpen" 
  [currentStatus]="selectedOccurrenceStatus"
  (close)="closeStatusModal()"
  (save)="handleStatusUpdate($event)">
</app-status-update-modal>
